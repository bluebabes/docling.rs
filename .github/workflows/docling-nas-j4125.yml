name: Docling J4125 NAS image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - crates/docling-serve/Dockerfile.nas
      - .github/workflows/docling-nas-j4125.yml

permissions:
  contents: read

concurrency:
  group: docling-nas-j4125
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish linux/amd64 NAS image
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/bluebabes/docling-rs-serve:nas-j4125
    steps:
      - name: Check out fork source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the J4125 image from source
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/docling-serve/Dockerfile.nas
          target: serve-nas
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/bluebabes/docling-rs-serve:nas-j4125
          cache-from: type=gha,scope=docling-nas-j4125
          cache-to: type=gha,mode=max,scope=docling-nas-j4125

      - name: Check binary startup and Chinese OCR languages
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /usr/local/bin/docling-serve "$IMAGE" --help >/dev/null
          docker run --rm --entrypoint tesseract "$IMAGE" --list-langs 2>&1 | grep -qx chi_sim

      - name: Verify startup on an emulated non-AVX CPU
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user root --entrypoint /bin/sh "$IMAGE" -ec '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends qemu-user >/dev/null
            qemu-x86_64 -cpu Westmere -L / /usr/local/bin/docling-serve --help >/dev/null
          '

      - name: Check HTTP readiness and model initialization
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name docling-nas-smoke -p 127.0.0.1:15001:5001 "$IMAGE"
          trap 'docker logs --tail 100 docling-nas-smoke || true; docker rm -f docling-nas-smoke >/dev/null 2>&1 || true' EXIT
          ready=false
          for attempt in $(seq 1 90); do
            if curl --noproxy '*' -fsS http://127.0.0.1:15001/ready >/dev/null; then
              ready=true
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' docling-nas-smoke)" != "true" ]; then
              echo 'Server exited during warmup' >&2
              exit 1
            fi
            sleep 5
          done
          if [ "$ready" != "true" ]; then
            echo 'Server did not become ready within 450 seconds' >&2
            exit 1
          fi
          curl --noproxy '*' -fsS http://127.0.0.1:15001/health

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish NAS-only image
        shell: bash
        run: |
          set -euo pipefail
          image_base="${IMAGE%:*}"
          commit_tag="nas-${GITHUB_SHA::12}"
          docker tag "$IMAGE" "$image_base:$commit_tag"
          docker push "$image_base:$commit_tag"
          docker push "$IMAGE"
          echo "Image: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit image: $image_base:$commit_tag" >> "$GITHUB_STEP_SUMMARY"
